<div [class]="getCardClasses() + ' p-6 transition-all duration-300'">
  <!-- Card Header -->
  <div *ngIf="title" class="mb-4">
    <h3 class="font-bold text-base text-slate-200 tracking-tight">{{ title }}</h3>
    <p *ngIf="subtitle" class="text-xs text-slate-400 mt-0.5">{{ subtitle }}</p>
  </div>
  <!-- Card Content -->
  <div>
    <ng-content></ng-content>
  </div>
</div>
